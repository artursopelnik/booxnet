<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img">
  <!-- Platzhalter-Szene "nebenbei hören". Siehe szene-pendeln.svg. -->
  <defs>
    <clipPath id="h-rund"><rect width="480" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#h-rund)">
    <rect width="480" height="360" fill="#eaf3ec"/>

    <!-- Wandregal mit Gläsern -->
    <rect x="40" y="86" width="150" height="9" rx="4" fill="#c5ded0"/>
    <rect x="58" y="56" width="22" height="30" rx="5" fill="#d8e9de"/>
    <rect x="90" y="62" width="22" height="24" rx="5" fill="#d8e9de"/>
    <rect x="122" y="50" width="22" height="36" rx="5" fill="#d8e9de"/>

    <!-- Topfpflanze rechts -->
    <path d="M404 196c0-30 12-52 28-64-4 22-2 44 6 64z" fill="#5aa87a"/>
    <path d="M404 196c-16-24-18-48-12-66 14 16 22 38 24 66z" fill="#78bd93"/>
    <path d="M396 196h48l-6 44a10 10 0 0 1-10 9h-16a10 10 0 0 1-10-9z" fill="#d98a1c"/>

    <!-- Arbeitsplatte -->
    <rect x="0" y="248" width="480" height="16" rx="6" fill="#c5ded0"/>
    <rect x="0" y="264" width="480" height="96" fill="#dcebe1"/>

    <!-- Figur hinter der Platte -->
    <g>
      <!-- Rumpf -->
      <path d="M196 150h60a22 22 0 0 1 22 22v76H174v-76a22 22 0 0 1 22-22z" fill="#0b63d6"/>
      <!-- Arm zur Tasse -->
      <path d="M276 178c16 8 22 22 20 38" stroke="#0b63d6" stroke-width="18" stroke-linecap="round" fill="none"/>
      <!-- Hals und Kopf -->
      <rect x="217" y="134" width="18" height="20" fill="#c98b63"/>
      <circle cx="226" cy="112" r="29" fill="#dda279"/>
      <!-- Haare, hochgesteckt -->
      <path d="M197 108a29 29 0 0 1 58 0c0-20-13-30-29-30s-29 10-29 30z" fill="#2b2018"/>
      <circle cx="256" cy="86" r="13" fill="#2b2018"/>
      <!-- Kopfhoerer -->
      <path d="M196 112a30 30 0 0 1 60 0" stroke="#16294c" stroke-width="7" fill="none" stroke-linecap="round"/>
      <rect x="188" y="104" width="16" height="26" rx="8" fill="#16294c"/>
      <rect x="248" y="104" width="16" height="26" rx="8" fill="#16294c"/>
    </g>

    <!-- Tasse auf der Platte -->
    <path d="M296 214h44v26a12 12 0 0 1-12 12h-20a12 12 0 0 1-12-12z" fill="#ffffff"/>
    <path d="M340 220h10a10 10 0 0 1 0 20h-10" stroke="#ffffff" stroke-width="7" fill="none"/>
    <!-- Dampf -->
    <g stroke="#9ec7ae" stroke-width="5" stroke-linecap="round" fill="none" opacity=".8">
      <path d="M310 204c6-8-6-14 0-22"/>
      <path d="M326 204c6-8-6-14 0-22"/>
    </g>

    <!-- Tonwellen -->
    <g stroke="#0b63d6" stroke-width="6" stroke-linecap="round" opacity=".5" fill="none">
      <path d="M152 102a26 26 0 0 0 0 32"/>
      <path d="M134 90a48 48 0 0 0 0 56"/>
    </g>
  </g>
</svg>

# Auslieferung der Werbeseite (booxnet.tld). Die Anwendung selbst laeuft
# in einem eigenen Container unter app.booxnet.tld - siehe Dockerfile.
#
# Absichtlich getrennt: Die App bringt ~400 MB Sprachmodelle mit. Waeren
# beide im selben Abbild, wuerde jede Komma-Korrektur an einem Werbetext
# einen 400-MB-Build und -Deploy ausloesen.

# Sprache aus dem Wunsch des Browsers ableiten. Nur die erste passende
# Angabe zaehlt; wer nichts Passendes mitbringt, bekommt Deutsch.
# Die Reihenfolge hier ist die Pruefreihenfolge - laengere Muster zuerst.
map $http_accept_language $sprache {
    default          de;
    ~*^\s*de         de;
    ~*^\s*en         en;
    ~*^\s*es         es;
    ~*^\s*fr         fr;
    ~*^\s*ru         ru;
    ~*^\s*tr         tr;
    ~*^\s*[a-z-]+\s*(;q=[0-9.]+)?\s*,\s*de  de;
    ~*^\s*[a-z-]+\s*(;q=[0-9.]+)?\s*,\s*en  en;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # Kein Cross-Origin-Isolation-Header hier: Die Werbeseite braucht
    # keinen SharedArrayBuffer, und die Header wuerden nur eingebettete
    # Fremdinhalte blockieren, falls spaeter welche dazukommen.

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Die Wurzel leitet auf die passende Sprachfassung weiter.
    #
    # Vary und no-store sind hier keine Feinheit, sondern noetig: Ohne sie
    # koennte ein Zwischenspeicher die Weiterleitung EINES Besuchers an
    # alle weiterreichen - der erste Franzose schickte dann alle nach /fr/.
    location = / {
        add_header Vary Accept-Language always;
        add_header Cache-Control "no-store" always;
        return 302 /$sprache/;
    }

    # Die Sprachseiten tragen keine Hashes im Namen - kurz cachen, damit
    # eine Textaenderung schnell durchschlaegt.
    location ~ ^/(de|en|es|fr|ru|tr)/$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri ${uri}index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

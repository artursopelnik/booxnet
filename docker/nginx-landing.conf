# Auslieferung der Werbeseite (booxnet.tld). Die Anwendung selbst laeuft
# in einem eigenen Container unter app.booxnet.tld - siehe Dockerfile.
#
# Absichtlich getrennt: Die App bringt ~400 MB Sprachmodelle mit. Waeren
# beide im selben Abbild, wuerde jede Komma-Korrektur an einem Werbetext
# einen 400-MB-Build und -Deploy ausloesen.

# ----------------------------------------------------- Sprachaushandlung
#
# In drei Schritten, weil eine einzelne Regel entweder den Wunsch des
# Browsers oder die Auswahl an Sprachen verfehlt:
#
#   1. Was steht ganz vorn? Das ist die Sprache, die der Nutzer wirklich
#      will - "de-AT,de;q=0.9,en;q=0.8" heisst Deutsch, nicht Englisch.
#   2. Falls die nicht dabei ist: Kommt weiter hinten etwas Passendes?
#      Ein Japaner mit Englisch an zweiter Stelle soll Englisch bekommen
#      und nicht Deutsch.
#   3. Sonst die Vorgabe.
#
# ACHTUNG bei Aenderungen: Muster mit ";" oder "{" MUESSEN in
# Anfuehrungszeichen stehen - ein nacktes Semikolon beendet sonst die
# Anweisung, und nginx startet mit "invalid number of the map parameters"
# gar nicht erst.

# 1. Die vorderste Angabe, auf zwei Buchstaben gekuerzt.
map $http_accept_language $wunsch {
    default                    "";
    "~*^[[:space:]]*([a-z]{2})" $1;
}

map $wunsch $erste_wahl {
    default "";
    de      de;
    en      en;
    es      es;
    fr      fr;
    ru      ru;
    tr      tr;
}

# 2. Irgendeine unterstuetzte Sprache im ganzen Kopf. Die Reihenfolge
#    hier entscheidet, welche zuerst gewinnt - nginx nimmt den ersten
#    passenden Ausdruck, nicht den mit dem hoechsten q-Wert.
map $http_accept_language $zweite_wahl {
    default    de;
    "~*(^|,)[[:space:]]*en" en;
    "~*(^|,)[[:space:]]*es" es;
    "~*(^|,)[[:space:]]*fr" fr;
    "~*(^|,)[[:space:]]*ru" ru;
    "~*(^|,)[[:space:]]*tr" tr;
}

# 3. Zusammenfuehren.
map $erste_wahl $sprache {
    ""      $zweite_wahl;
    default $erste_wahl;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # text/html steht bewusst NICHT dabei: Das komprimiert nginx bei
    # aktivem gzip ohnehin, und doppelt genannt meldet es beim Start
    # "duplicate MIME type".
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # Kein Cross-Origin-Isolation-Header hier: Die Werbeseite braucht
    # keinen SharedArrayBuffer, und die Header wuerden nur eingebettete
    # Fremdinhalte blockieren, falls spaeter welche dazukommen.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Die Wurzel leitet auf die passende Sprachfassung weiter.
    #
    # Die beiden Kopfzeilen oben werden hier WIEDERHOLT: add_header erbt
    # in nginx nicht - sobald ein Block eigene Kopfzeilen setzt, fallen
    # die der Ebene darueber weg.
    #
    # Vary und no-store sind keine Feinheit, sondern noetig: Ohne sie
    # koennte ein Zwischenspeicher die Weiterleitung EINES Besuchers an
    # alle weiterreichen - der erste Franzose schickte dann alle nach /fr/.
    location = / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Vary Accept-Language always;
        add_header Cache-Control "no-store" always;
        return 302 /$sprache/;
    }

    # Die Sprachseiten tragen keine Hashes im Namen - kurz cachen, damit
    # eine Textaenderung schnell durchschlaegt. Bewusst ohne Aufzaehlung
    # der Sprachen: Die stuende sonst ein drittes Mal im Projekt und
    # liefe beim naechsten Zuwachs auseinander.
    location ~ "^/[a-z]{2}/$" {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri ${uri}index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

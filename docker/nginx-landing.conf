# Auslieferung der Werbeseite (booxnet.tld). Die Anwendung selbst laeuft
# in einem eigenen Container unter app.booxnet.tld - siehe Dockerfile.
#
# Absichtlich getrennt: Die App bringt ~400 MB Sprachmodelle mit. Waeren
# beide im selben Abbild, wuerde jede Komma-Korrektur an einem Werbetext
# einen 400-MB-Build und -Deploy ausloesen.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # Kein Cross-Origin-Isolation-Header hier: Die Werbeseite braucht
    # keinen SharedArrayBuffer, und die Header wuerden nur eingebettete
    # Fremdinhalte blockieren, falls spaeter welche dazukommen.

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Die Seite ist eine einzelne Datei ohne Hashes im Namen - kurz
    # cachen, damit eine Textaenderung schnell durchschlaegt.
    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

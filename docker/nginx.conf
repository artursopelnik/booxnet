# Auslieferung von Booxnet auf einem eigenen Server.
#
# Was hier steht, ersetzt public/_headers und public/_redirects: Die
# gelten nur bei Netlify. Auf dem eigenen Server macht das nginx - und
# nur deshalb laesst sich hier ueberhaupt einstellen, was GitHub Pages
# grundsaetzlich nicht kann.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cross-Origin-Isolation: schaltet SharedArrayBuffer frei und damit
    # Mehrkern-Betrieb fuer die Sprach-Engine (worker.ts waehlt dann
    # Kerne-1 Threads statt einem). OHNE diese beiden Zeilen rechnet die
    # Synthese einkernig und ist um ein Vielfaches langsamer - das ist
    # der wichtigste Grund, die Auslieferung selbst in der Hand zu haben.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # Die Sprachmodelle sind gross und binaer. gzip brauchte hier CPU,
    # ohne etwas einzusparen: ONNX-Gewichte sind praktisch nicht
    # komprimierbar.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Unveraenderliche Dateien: gehashte Build-Assets, die versionierte
    # onnxruntime-Laufzeit und die Sprachmodelle. Lange Cache-Zeiten
    # sparen nicht nur Roundtrips - ein abgebrochener 383-MB-Download
    # setzt beim naechsten Versuch auf dem Browser-Cache auf.
    location /assets/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /ort/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /supertonic/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Bereichsabrufe erlauben: Damit kann ein unterbrochener Download
        # der Modelle fortsetzen statt von vorn zu beginnen.
        add_header Accept-Ranges bytes always;
    }

    # Der Service Worker darf NIE aus dem Cache kommen - sonst bleibt die
    # App auf einer alten Fassung stehen und findet nie zurueck.
    location = /sw.js {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # SPA-Rueckfall: Client-Routen wie /reader/<id> liefern die App aus.
    #
    # Bewusst NUR hier und nicht in den Bloecken oben: Eine fehlende
    # Modelldatei soll einen ehrlichen 404 geben statt index.html. Die
    # App faengt den HTML-Fall zwar ab (fetchAsset in assets.ts), aber
    # ein 404 benennt den Fehler, statt ihn zu verkleiden.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

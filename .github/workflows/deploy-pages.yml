name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Nach dem Einchecken des Sprachpakets automatisch neu ausliefern.
  # Noetig, weil ein Push mit dem GITHUB_TOKEN bewusst KEINE weiteren
  # Workflows ausloest (Endlosschleifen-Schutz) - ohne diesen Ausloeser
  # bliebe die Seite auf dem Stand vor dem Sprachpaket stehen, obwohl
  # die Modelle laengst im Repository liegen.
  workflow_run:
    workflows: ['Sprachpaket einchecken']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Kam der Anstoss vom Sprachpaket-Workflow, nur bei dessen Erfolg
    # ausliefern - ein fehlgeschlagener Download soll nicht in einem
    # zweiten roten Lauf muenden.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Die Sprachmodelle kommen aus dem Checkout (models/supertonic/) und
      # werden im prebuild-Schritt nach public/supertonic/ zusammengesetzt –
      # kein Download, kein Cache, keine fremde Quelle.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: SPA fallback & .nojekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Bewusst ohne environment-Block: Die Schutzregel der github-pages-
    # Umgebung erlaubt nur den alten Default-Branch und blockiert damit
    # jeden Deploy von main (Job wird ohne Runner sofort abgewiesen).
    # Ohne Umgebungs-Referenz greift die Regel nicht; das Deployment
    # erscheint trotzdem unter der github-pages-Umgebung.
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
